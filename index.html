<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealizE ✨</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="hero">
    <img class="logo" src="assets/logo.jpg" alt="RealizE logo">
    <h1 id="group-name"></h1>
    <p id="group-tagline" class="tagline"></p>
    <p id="group-intro" class="sub"></p>
    <p id="group-sub" class="sub"></p>
    <p id="group-links" class="sub"></p>
    <div id="next-show" class="next-show"></div>
    <div id="stats" class="stats"></div>
    <img class="hero-photo" src="assets/group-photo.jpg" alt="RealizE 团体公式照">
  </header>

  <main>
    <section>
      <h2>成员 <span class="h2-en">MEMBER</span></h2>
      <div id="members" class="members"></div>
    </section>

    <section>
      <h2>演出档案 <span class="h2-en">SCHEDULE</span> <span id="show-count" class="h2-sub"></span></h2>
      <div id="filters" class="filters"></div>
      <div id="shows" class="shows"></div>
    </section>

    <section>
      <h2>大事纪 <span class="h2-en">HISTORY</span></h2>
      <div id="timeline" class="timeline"></div>
    </section>
  </main>

  <footer>
    非官方粉丝应援站 · 数据手工整理，可能有误 ·
    部分资料来自 <a href="https://chinaidols.fandom.com/zh/wiki/RealizE" target="_blank" rel="noopener">中国偶像 Wiki</a>（CC BY-SA）<br>
    公共数据：<a href="data/shows.json">演出记录 shows.json</a> ·
    <a href="data/events.json">大事纪 events.json</a> ·
    <a href="edit.html">编辑（仅本地）</a>
  </footer>

  <script src="js/derive.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
